# cargo-deny configuration for oxcrypt-core
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]
all-features = true

# =============================================================================
# Advisories - CVE and security vulnerability detection
# =============================================================================
[advisories]
# Only flag unmaintained crates that the workspace depends on directly;
# transitive ones (e.g. GTK3 bindings via dioxus-desktop's Linux webview
# stack, ansi_term/atty via dudect-bencher) are outside our control.
unmaintained = "workspace"
# Ignore these advisories (with justification)
ignore = [
    # rsa is pulled in by jsonwebtoken's rust_crypto feature but never used:
    # vault config JWTs are HMAC-signed (HS256/384/512) per the Cryptomator spec,
    # and jsonwebtoken has no feature flag to drop the RSA algorithms.
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin attack - RSA code paths unused (HMAC-only JWTs), no fixed version exists" },
    # quick-xml 0.26 comes via pprof -> inferno 0.11 (flamegraph SVG generation).
    # The latest pprof (0.15) still requires inferno ^0.11, which pins quick-xml 0.26.
    # DoS-only advisories on XML parsing; inferno only parses its own generated SVG,
    # and pprof is used exclusively by the oxcrypt-bench profiling harness.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml DoS - bench-only via pprof/inferno, no attacker-controlled input" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml DoS - bench-only via pprof/inferno, no attacker-controlled input" },
]

# Informational "unsound" advisories are not evaluated by cargo-deny, so they
# cannot be listed above (an entry there is dead config and emits
# `advisory-not-detected`). They do surface in `cargo audit` and in GitHub's
# Dependabot alerts, and are suppressed in .cargo/audit.toml. Triage:
#
# RUSTSEC-2021-0145 (atty, potential unaligned read) - atty 0.2.14 arrives
#   through clap 2.34 -> dudect-bencher, a dev-dependency of oxcrypt-core used
#   only by the benches/timing_leaks.rs constant-time harness. atty is
#   unmaintained with no patched release; the unaligned read is in its Windows
#   msys/cygwin TTY probe, which never runs on the Linux and macOS targets this
#   workspace builds, and never in a shipped binary.
#
# RUSTSEC-2024-0429 (glib, VariantStrIter Iterator unsoundness) - glib 0.18.5
#   is pinned by the gtk3-rs 0.18 stack (gtk/gdk/atk/webkit2gtk) that
#   dioxus-desktop pulls in for its Linux webview and tray icon. The gtk crate
#   is deprecated and stops at 0.18.2, so glib >= 0.20 is unreachable without
#   dioxus dropping GTK3. VariantStrIter is a GVariant string-array iterator
#   that oxcrypt never constructs, and the crates are Linux-only.
#
# RUSTSEC-2026-0097 (rand, unsound with a reentrant custom logger) - rand 0.7.3
#   is a *build*-dependency: phf_generator 0.8 <- phf_codegen 0.8 <-
#   selectors 0.24 (build script) <- kuchikiki <- wry <- dioxus-desktop. It only
#   seeds perfect-hash tables at compile time. The unsoundness requires a custom
#   `log` logger that reentrantly calls rand::rng(); build scripts install no
#   logger. Vault crypto uses rand 0.9/0.10, never this copy.

# =============================================================================
# Licenses - ensure all dependencies are compatibly licensed
# =============================================================================
[licenses]
confidence-threshold = 0.93
# Allow these licenses (compatible with MPL-2.0)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    # bzip2 license - permissive, similar to BSD (via libbz2-rs-sys -> zip)
    "bzip2-1.0.6",
    # Community Data License Agreement - permissive (via webpki-roots)
    "CDLA-Permissive-2.0",
]

# Per-crate license exceptions
exceptions = [
    # inferno's flamegraph rendering is CDDL-1.0 (from Brendan Gregg's
    # flamegraph.pl). Bench-only via pprof; never linked into shipped binaries.
    { crate = "inferno", allow = ["CDDL-1.0"] },
]

# Handle special license cases
[[licenses.clarify]]
crate = "ring"
expression = "Apache-2.0 AND ISC"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
crate = "aws-lc-rs"
expression = "(Apache-2.0 OR ISC) AND ISC"
license-files = [{ path = "LICENSE", hash = 0x2e8b0bf2 }]

[[licenses.clarify]]
crate = "aws-lc-sys"
expression = "(Apache-2.0 OR ISC) AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0x4c12ab3a }]

[licenses.private]
ignore = false
registries = []

# =============================================================================
# Bans - deny specific crates or versions
# =============================================================================
[bans]
multiple-versions = "warn"
wildcards = "allow"  # Allow workspace dependencies using .workspace = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Deny known problematic crates
deny = [
    # Deprecated/insecure crypto implementations
    { crate = "rust-crypto", reason = "Deprecated, known security issues" },
    # Wrapper exception: dioxus-desktop's websocket stack (tungstenite ->
    # native-tls) links the system TLS on Linux; that never touches vault
    # crypto, which stays on ring/aws-lc-rs.
    { crate = "openssl", reason = "Prefer ring/aws-lc-rs for this project", wrappers = ["native-tls"] },

    # Old rand versions with known issues
    { crate = "rand@<0.7", reason = "Old version with known issues" },
    { crate = "rand_core@<0.5", reason = "Old version with known issues" },
]

# Skip duplicate version warnings for these (expected due to dependency tree)
skip = [
    # Transitive dependencies with version splits
    { crate = "getrandom@0.2", reason = "RustCrypto uses 0.2, rand 0.9 uses 0.3" },
    { crate = "rand_core@0.6", reason = "RustCrypto transitives" },

    # aws-lc-rs uses untrusted 0.7, ring uses 0.9
    { crate = "untrusted@0.7", reason = "aws-lc-rs uses different version than ring" },
]

# Skip entire trees from duplicate detection
skip-tree = [
    # dudect-bencher's entire dependency tree uses older versions
    { crate = "dudect-bencher", reason = "Dev-only timing analysis tool with old deps" },
]

# =============================================================================
# Sources - ensure all dependencies come from trusted sources
# =============================================================================
[sources]
unknown-registry = "deny"
unknown-git = "warn"  # Warn instead of deny to allow fskit-rs during development
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # FSKit Rust bindings - required for oxcrypt-fskit (macOS 15.4+)
    "https://github.com/debox-network/fskit-rs",
]
