# Build configuration for optimized compile times
# See docs/COMPILE_TIMES.md or plan file for details

# macOS ARM (Apple Silicon)
[target.aarch64-apple-darwin]
rustflags = [
  "--cfg", "tokio_unstable",  # Enable tokio-console task introspection
  "--cfg", "aes_armv8",       # Enable hardware AES (ARMv8 Crypto Extensions)
  "--cfg", "polyval_armv8",   # Enable hardware POLYVAL (PMULL instructions)
]
# Note: macOS clang doesn't support -fuse-ld flag
# Using Apple's default linker (ld64) which is already quite fast on macOS 15+
# Main speedups come from sccache + reduced debug info

# macOS Intel
[target.x86_64-apple-darwin]
rustflags = [
  "--cfg", "tokio_unstable"  # Enable tokio-console task introspection
]

# Linux ARM64
[target.aarch64-unknown-linux-gnu]
rustflags = [
  "--cfg", "aes_armv8",       # Enable hardware AES (ARMv8 Crypto Extensions)
  "--cfg", "polyval_armv8",   # Enable hardware POLYVAL (PMULL instructions)
]

# Note: the mold linker is NOT configured here because this file is committed
# and would break builds on machines without mold (e.g. CI runners). The
# devenv shell opts into mold on Linux via CARGO_TARGET_*_RUSTFLAGS env vars.
